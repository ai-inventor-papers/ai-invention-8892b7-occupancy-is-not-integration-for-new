entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r d2/requirements.lock.txt"
  - path: d2/results/cache/
    delete: regenerable
    source: "AII_DEPS_ROOT=<run>/3_invention_loop .venv/bin/python k2/k2_prepare.py main"
  - path: mesh/cache/
    delete: regenerable
    source: "AII_DEPS_ROOT=<run>/3_invention_loop .venv/bin/python k2/k2_prepare.py mesh"
  - path: cache/
    delete: regenerable
    source: "cd k2 && ../.venv/bin/python k2_features.py"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "recreated automatically by python on import"
