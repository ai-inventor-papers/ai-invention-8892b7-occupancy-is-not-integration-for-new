entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r d2/requirements.lock.txt"
  - path: k/__pycache__/
    delete: regenerable
    source: "uv run eval.py --stages report (bytecode is rebuilt on import)"
  - path: d2/src/__pycache__/
    delete: regenerable
    source: "uv run eval.py --stages report (bytecode is rebuilt on import)"
  - path: d2/tests/__pycache__/
    delete: regenerable
    source: "cd d2 && ../.venv/bin/python -m pytest -q"
  - path: mesh/src/__pycache__/
    delete: regenerable
    source: "uv run eval.py --stages run (bytecode is rebuilt on import)"
  - path: mesh/vendor/__pycache__/
    delete: regenerable
    source: "uv run eval.py --stages run (bytecode is rebuilt on import)"
  - path: d2/.pytest_cache/
    delete: regenerable
    source: "cd d2 && ../.venv/bin/python -m pytest -q"
