entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python make_all.py"
  - path: src/plots/__pycache__/
    delete: regenerable
    source: ".venv/bin/python make_all.py"
  - path: checks/__pycache__/
    delete: regenerable
    source: ".venv/bin/python eval.py"
