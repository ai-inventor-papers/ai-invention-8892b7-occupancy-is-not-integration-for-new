entries:
  - path: cache/openalex_cache.tar.gz.part_*
    keep: all paid OpenAlex API responses (1,847 credits) as a 2-part archive; needed to rebuild without re-paying
  - path: .venv/
    delete: regenerable
    source: "./restore.sh (uv venv .venv --python=3.12 && uv pip install ... && python -m spacy download en_core_web_sm)"
  - path: temp/datasets/
    delete: redownloadable
    source: "python scripts/s0_download_hf.py (midas/semeval2017, zj88zj/SCIERC, amirveyseh/acronym_identification, midas/inspec, midas/semeval2010, midas/nus, taln-ls2n/kp20k) + scripts/s3_fetch_snapshot_vocab.py (s3://openalex/data/jsonl/{keywords,concepts}) + scripts/s3_parse_mesh.py"
  - path: raw/mesh/
    delete: redownloadable
    source: "https://nlmpubs.nlm.nih.gov/projects/mesh/MESH_FILES/xmlmesh/desc2026.gz"
  - path: raw/candidates.pkl.gz
    delete: regenerable
    source: "python scripts/s2_candidates.py"
  - path: raw/docs_meta.pkl.gz
    delete: regenerable
    source: "python scripts/s2_candidates.py"
  - path: raw/key_stats.pkl.gz
    delete: regenerable
    source: "python scripts/s5_label.py select"
  - path: scripts/__pycache__/
    delete: regenerable
    source: "created automatically by python on import"
