entries:
  - path: works/
    keep: the population's works parts (gzip JSONL), assembled from ~1,800 paid OpenAlex credits plus hours of rate-limited free lookups
  - path: raw/
    delete: redownloadable
    source: ".venv/bin/python build_population.py --download-only   # NLM MeSH files from https://nlmpubs.nlm.nih.gov/projects/mesh/ (desc2017/desc2019/desc2026 XML, d2003-d2018 ASCII, replace2004-2018)"
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: scripts/__pycache__/
    delete: regenerable
    source: "created automatically by python when scripts are imported"
  - path: temp/datasets/works/
    delete: regenerable
    source: ".venv/bin/python scripts/s10_export_datasets.py   # hard links to works/works_part_*.jsonl.gz"
