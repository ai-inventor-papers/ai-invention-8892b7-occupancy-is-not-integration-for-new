entries:
  - path: .venv/
    delete: redownloadable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: __pycache__/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q tests (Python recreates bytecode caches on import)"
  - path: src/__pycache__/
    delete: regenerable
    source: "uv run method.py (Python recreates bytecode caches on import)"
  - path: vendor/__pycache__/
    delete: regenerable
    source: "uv run method.py (Python recreates bytecode caches on import)"
  - path: tests/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q tests"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q tests"
