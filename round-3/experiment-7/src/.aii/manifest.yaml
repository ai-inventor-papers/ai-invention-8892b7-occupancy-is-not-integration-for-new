entries:
  - path: .venv/
    delete: redownloadable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: results/cache/prepared.pkl
    delete: regenerable
    source: ".venv/bin/python method.py --stage 1   # rebuilds the compact dataset_5 cache in about 10 s"
