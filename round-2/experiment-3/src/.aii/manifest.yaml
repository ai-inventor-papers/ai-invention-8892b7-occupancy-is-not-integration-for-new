entries:
  - path: .venv/
    delete: redownloadable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: __pycache__/
    delete: regenerable
    source: "recreated automatically when any script runs"
  - path: tests/__pycache__/
    delete: regenerable
    source: "recreated automatically when pytest runs"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q -c pytest.ini tests"
