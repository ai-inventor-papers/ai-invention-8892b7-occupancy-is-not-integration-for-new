entries:
  - path: hyd/work_store/
    keep: 491k hydrated OpenAlex works incl. verification text; irreproducible without ~250k API calls and credits; not published
  - path: hyd/works/
    keep: D2 works table (8 parquet parts, 163 MB), a deliverable read by later steps
  - path: .venv/
    delete: redownloadable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: hyd/snapshot_entities/
    delete: redownloadable
    source: "cd hyd && ../.venv/bin/python download_snapshot.py sources   # anonymous s3://openalex/data/parquet/sources"
  - path: scimago_raw/
    delete: redownloadable
    source: "bash restore.sh   # curl Zenodo 22954453 SJR panel + docs, dhimmel/scopus ASJC table, Zenodo 4767023 lookup; then python p3_venue_habitat.py scimago"
  - path: hyd/__pycache__/
    delete: regenerable
    source: "recreated automatically by python on import"
