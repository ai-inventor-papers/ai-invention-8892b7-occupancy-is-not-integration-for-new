entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: results/cache/prepared.pkl
    delete: regenerable
    source: ".venv/bin/python method.py --stage gates"
  - path: cache/mesh_prepared.pkl
    delete: regenerable
    source: ".venv/bin/python method.py --stage load"
  - path: src/__pycache__/
    delete: regenerable
    source: "created automatically by python on import"
  - path: vendor/__pycache__/
    delete: regenerable
    source: "created automatically by python on import"
  - path: tests/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q tests/"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q tests/"
  - path: results/substrate/mesh_coword.parquet
    keep: yearly MeSH co-word network (2.4M pair-year rows) behind log_centrality; a later step reads it
