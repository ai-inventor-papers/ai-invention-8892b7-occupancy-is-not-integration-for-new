entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: results/cache/
    delete: regenerable
    source: ".venv/bin/python eval.py --stage prepare"
  - path: src/__pycache__/
    delete: regenerable
    source: "recreated automatically by Python on import (.venv/bin/python eval.py --stage assemble)"
  - path: vendor/__pycache__/
    delete: regenerable
    source: "recreated automatically by Python on import (.venv/bin/python eval.py --stage assemble)"
