entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: deps_run/exp5/.venv/
    delete: regenerable
    source: "cd deps_run/exp5 && uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: deps_run/exp6/.venv/
    delete: regenerable
    source: "cd deps_run/exp6 && uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: deps_run/exp6/work/cp.parquet
    delete: regenerable
    source: "bash restore.sh  # byte copy of round-3/experiment-6/src/work/cp.parquet"
  - path: deps_run/exp6/work/authors.parquet
    delete: regenerable
    source: "bash restore.sh  # byte copy of round-3/experiment-6/src/work/authors.parquet"
  - path: deps_run/exp5/.pytest_cache/
    delete: regenerable
    source: "cd deps_run/exp5 && .venv/bin/python -m pytest -q tests"
  - path: results/r1/r1_capture_raw.pkl
    keep: raw recorder dump of the single one-look R1 held-out run (matched sets + feature frames); not reproducible without re-opening the fold
  - path: "**/__pycache__/"
    delete: regenerable
    source: "regenerated automatically by the Python interpreter on import"
  - path: __pycache__/
    delete: regenerable
    source: "regenerated automatically by the Python interpreter on import (e.g. .venv/bin/python audit_d3_calibration.py)"
  - path: src_eval/__pycache__/
    delete: regenerable
    source: "regenerated automatically by the Python interpreter on import (e.g. .venv/bin/python d3_link.py)"
