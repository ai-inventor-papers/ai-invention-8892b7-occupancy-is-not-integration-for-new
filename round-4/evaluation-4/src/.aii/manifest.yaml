entries:
  - path: exp8_frozen/heldout_run/
    keep: irreproducible one-time held-out opening (OPENED marker + all stage outputs, spec 695166b4); a second opening is refused by design
  - path: exp8_frozen/.venv/
    delete: regenerable
    source: "cd exp8_frozen && uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r ../pyproject.toml"
  - path: exp8_frozen/src/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import"
  - path: exp8_frozen/vendor/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import"
  - path: exp8_frozen/tests/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import"
  - path: evalsteps/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import"
  - path: __pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import"
  - path: scripts/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import"
