entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: work/cp_hyd.parquet
    delete: regenerable
    source: ".venv/bin/python method.py --stage prep"
  - path: heldout_sim/work/
    delete: regenerable
    source: ".venv/bin/python confirm_heldout.py --simulate"
  - path: __pycache__/
    delete: regenerable
    source: "recreated automatically when any script runs"
  - path: src/__pycache__/
    delete: regenerable
    source: "recreated automatically when any script runs"
  - path: vendor/__pycache__/
    delete: regenerable
    source: "recreated automatically when any script runs"
  - path: tests/__pycache__/
    delete: regenerable
    source: "recreated automatically when pytest runs"
